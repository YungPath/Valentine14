<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jessie 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: pink;
  overflow: hidden;
  text-align: center;
}

h1 {
  font-size: 2.5em;
  margin-top: 30px;
}

p {
  font-size: 1.2em;
}

button {
  padding: 15px 25px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  margin: 15px;
}

#yes {
  background: #ff3366;
  color: white;
}

#no {
  background: white;
  position: absolute;
}

img {
  width: 85%;
  max-width: 320px;
  border-radius: 25px;
  margin-top: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.heart {
  position: fixed;
  color: red;
  font-size: 20px;
  animation: float 4s linear infinite;
}

@keyframes float {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-600px); opacity: 0; }
}
</style>
</head>

<body>

<h1>Jessie 💕</h1>
<p>Will you be my Valentine? 💘</p>

<!-- 📸 Photo -->
<img src="us.jpg" alt="Us together ❤️">

<br>

<button id="yes" onclick="yesClick()">YES ❤️</button>
<button id="no" onmouseover="moveNo()">NO 😅</button>

<!-- 🎵 Background Music (plays after YES click) -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
function yesClick() {
  // Play music (mobile-friendly)
  document.getElementById("music").play();

  document.body.innerHTML = `
    <h1>Yaaay Jessie!!! 🥰💖</h1>
    <p><strong>Good choice 😘</strong></p>
    <p>Thank you for being my Valentine 💕</p>
    <p>— Teddy Bear 🧸</p>
    <p>📸 Screenshot this and send it to me 😘</p>
  `;
}

function moveNo() {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 100);
  const noBtn = document.getElementById("no");
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

// 💕 Hearts animation
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.top = "100%";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 4000);
}, 300);
</script>

</body>
</html>
