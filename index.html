<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jessie 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: pink;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  font-size: 2.4em;
  margin-top: 25px;
}

p {
  font-size: 1.2em;
}

.container {
  position: relative;
  padding-bottom: 150px;
}

img {
  width: 85%;
  max-width: 320px;
  border-radius: 25px;
  margin-top: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.buttons {
  margin-top: 25px;
  position: relative;
  height: 120px;
}

button {
  padding: 15px 28px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

#yes {
  background: #ff3366;
  color: white;
}

#no {
  background: white;
  position: absolute;
  left: 55%;
  top: 50%;
}

.heart {
  position: fixed;
  font-size: 20px;
  color: red;
  animation: float 4s linear infinite;
}

@keyframes float {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-600px); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">
  <h1>Jessie 💕</h1>
  <p>Will you be my Valentine? 💘</p>

  <!-- 📸 Picture -->
  <img src="./us.jpg" alt="Us together ❤️">

  <!-- ❤️ Buttons -->
  <div class="buttons">
    <button id="yes" onclick="yesClick()">YES ❤️</button>
    <button id="no" onmouseover="moveNo()">NO 😅</button>
  </div>
</div>

<!-- 🎵 Music -->
<audio id="music" loop>
  <source src="./music.mp3" type="audio/mpeg">
</audio>

<script>
function yesClick() {
  document.getElementById("music").play();

  document.body.innerHTML = `
    <h1>Yaaay Jessie!!! 🥰💖</h1>
    <p><strong>Good choice 😘</strong></p>
    <p>Thank you for being my Valentine 💕</p>
    <p>— Teddy Bear 🧸</p>
    <p>📸 Screenshot this and send it to me 😘</p>
  `;
}

function moveNo() {
  const noBtn = document.getElementById("no");
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 120);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

// 💕 Floating hearts
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.top = "100%";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 4000);
}, 350);
</script>

</body>
</html>
